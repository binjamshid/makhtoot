# android/gradle/libs.versions.toml
#
# Work item 1.1 — version catalog (ANDROID_SPINE.md §2 D-300/D-301/D-304,
# ANDROID_TASK_PACKETS/BATCH-1.md Agent 1.1 task 2).
#
# This agent is the sole owner of every build.gradle.kts through Batch 8 (spine
# §3.2/§17), so an omission here is unrecoverable for a later batch without an
# android/docs/CONTRACT_CHANGES.md round-trip. Entries below therefore include
# every library named in the packet even where no Batch 1 module wires it yet
# (Batch 2+ modules apply them from this catalog when their source lands).
#
# D-304 carve-out: harfbuzz/freetype/lcms2 are vendored source under
# android/mk-native/third_party/ (Agent 1.2), not catalog entries — there is no
# Maven artifact for them. No analytics SDK dependency appears anywhere in this
# file, and none may ever be added (D-304, D-320).

[versions]
# --- Toolchain (D-300) ---
kotlin = "2.1.0"
agp = "8.7.3"
jdk = "17"
# D-300 specifies NDK r27. The machine this scaffold was built on has NDK
# 28.2.13676358 installed and no r27 side-by-side install. Pinned to the
# installed r28 explicitly (never "whatever is default") — see
# android/docs/impl-log/BATCH-1.1.md for the one-line deviation note; r27 can
# be installed via `sdkmanager --install "ndk;27.2.12479018"` if the founder
# wants strict D-300 adherence later, which is a one-line change back here.
ndk = "28.2.13676358"
cmakeVersion = "3.22.1"

# --- Compose / AndroidX UI ---
composeBom = "2024.12.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.4"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
appcompat = "1.7.0"

# --- Coroutines (D-302) ---
coroutines = "1.9.0"

# --- Persistence (D-308) ---
room = "2.6.1"
datastore = "1.1.1"

# --- Background work / security ---
workmanager = "2.10.0"
securityCrypto = "1.1.0-alpha06"

# --- Store (D-311) ---
playBilling = "7.1.1"

# --- Sync (D-310): Drive v3 REST + Credential Manager + GIS AuthorizationClient ---
googleApiClientAndroid = "2.7.0"
googleApiServicesDrive = "v3-rev20240914-2.0.0"
googleHttpClientGson = "1.45.0"
credentials = "1.3.0"
googleId = "1.1.1"
playServicesAuth = "21.3.0"

# --- Serialization / networking (D-304 JVM-side list) ---
kotlinxSerialization = "1.7.3"
okhttp = "4.12.0"

# --- Media / platform helpers ---
exifinterface = "1.3.7"
tracing = "1.2.0"
coil = "2.7.0"

# --- Test tooling (Batch 2+ consumers; catalog entries land now per task 2) ---
paparazzi = "1.3.4"
robolectric = "4.13"
androidJunit5Plugin = "1.10.0.0"
junitJupiter = "5.11.0"
espresso = "3.6.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
androidxBenchmark = "1.3.3"
baselineProfilePlugin = "1.3.3"
junit4 = "4.13.2"

[libraries]
# AndroidX core / Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Coroutines (D-302)
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Persistence (D-308)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }

# Background / security
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Store (D-311)
play-billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "playBilling" }

# Sync (D-310)
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "googleApiClientAndroid" }
google-api-services-drive = { group = "com.google.apis", name = "google-api-services-drive", version.ref = "googleApiServicesDrive" }
google-http-client-gson = { group = "com.google.http-client", name = "google-http-client-gson", version.ref = "googleHttpClientGson" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-id = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Serialization / networking
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Media / platform helpers
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-tracing = { group = "androidx.tracing", name = "tracing", version.ref = "tracing" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Test tooling
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junitJupiter" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.0-1.0.29" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5Plugin" }
baseline-profile = { id = "androidx.baselineprofile", version.ref = "baselineProfilePlugin" }
