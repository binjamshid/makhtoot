# android/gradle.properties
#
# Batch 1 · Agent 1.1 (ANDROID_SPINE.md §5, ANDROID_TASK_PACKETS/BATCH-1.md).
# D-300 pins JDK 17 for the whole toolchain. This machine's shell default is
# JDK 21 (verified 2026-07-30), so org.gradle.java.home pins the build to the
# Temurin 17 install explicitly rather than trusting JAVA_HOME — see
# android/docs/impl-log/BATCH-1.1.md for the verification and the rationale
# for not relying on the environment.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX only — no Support Library.
android.useAndroidX=true
# D-317: MkTheme via CompositionLocals, not MaterialTheme. Jetifier is not
# needed (every dependency in the version catalog is already AndroidX-native)
# and is left off deliberately.
android.nonTransitiveRClass=true

kotlin.code.style=official
