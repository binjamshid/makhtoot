<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makhtoot · binjamshid</title>
<style>
  :root {
    --accent: #8C4A32;
    --ink: #201d18; --muted: #6c6559; --line: #e4ded3;
    --bg: #ffffff; --soft: #faf7f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece7de; --muted: #a49c8e; --line: #33302a;
      --bg: #16150f; --soft: #1e1c16;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65; font-size: 17px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 22px 96px; }
  header.brand { border-bottom: 3px solid var(--accent); padding-bottom: 14px; margin-bottom: 28px; }
  .brand-name { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: .2px; }
  .brand-tag { font-size: 14px; color: var(--muted); margin-top: 2px; }
  /* explicit margin-left, not margin-inline-start: the span is dir="rtl", so
     inline-start would resolve to its right edge and collapse the visual gap */
  .ar { font-size: 20px; color: var(--muted); margin-left: 8px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 4px; }
  h2 { font-size: 18px; margin: 34px 0 10px; color: var(--accent); }
  p, li { color: var(--ink); }
  .lede { font-size: 18px; }
  ul.links { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.links li { margin: 8px 0; }
  a { color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
           margin: 12px 0; background: var(--soft); }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .card h3 a { text-decoration: none; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
            color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="brand-name">Makhtoot<span class="ar" dir="rtl" lang="ar">مخطوط</span></div>
    <div class="brand-tag">Arabic typography</div>
  </header>

  <p class="lede">Work on Arabic typography and manuscript-inspired type setting.</p>

  <h2>Legal &amp; support</h2>
  <ul class="links">
    <li><a href="/makhtoot/privacy">Privacy</a></li>
    <li><a href="/makhtoot/terms">Terms</a></li>
    <li><a href="mailto:support@binjamshid.com">Support</a></li>
  </ul>

  <footer><a href="/">All apps</a></footer>
</div>
</body>
</html>
